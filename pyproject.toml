[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.1.0"
description = "A terminal-first playground for studying agent execution loops."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgr>=2.2,<3",
    "huggingface-hub>=0.30,<2",
    "jsonschema>=4.23,<5",
    "mdit-py-plugins>=0.6,<1",
    "pylatexenc>=2.10,<3",
    "pyyaml>=6,<7",
    "regex>=2024.11.6,<2027",
    "requests>=2.31,<3",
    "textual>=8.2,<9",
    "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
mini-agent = "tui.cli:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"backend.planning.prompts" = ["*.md"]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["*/tui/*"]

[tool.coverage.report]
skip_covered = true
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
