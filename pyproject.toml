# Workspace root for the three-tier mini-agent: backend (server), tui (client), frontend (client).
[tool.uv.workspace]
members = ["backend", "tui"]

[tool.uv.sources]
mini-agent-backend = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["*/tui/*"]

[tool.coverage.report]
skip_covered = true
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
