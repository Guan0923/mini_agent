[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-backend"
version = "0.0.1"
description = "Mini-Agent local Agent Runtime and loopback FastAPI backend."
keywords = ["agent", "mcp", "skills", "subagents"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "huggingface-hub>=0.30,<2",
    "jsonschema>=4.23,<5",
    "mcp>=1.28,<2",
    "cryptography>=44,<50",
    "keyring>=25,<26",
    "pyyaml>=6,<7",
    "regex>=2024.11.6,<2027",
    "requests>=2.31,<3",
    "redis>=5.2,<7",
    "urllib3>=2.2,<3",
    "tokenizers>=0.21,<1",
    "tiktoken>=0.9,<1",
    "uvicorn>=0.34,<1",
    "pywin32>=308; sys_platform == 'win32'",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
web = []

[project.scripts]
mini-agent-mcp = "backend.mcp.cli:main"

# The `src` directory *is* the `backend` package (flat source layout).
# setuptools' explicit-layout discovery names everything under it `backend.*`.
[tool.setuptools]
package-dir = {backend = "src"}

[tool.setuptools.package-data]
"backend.planning.prompts" = ["*.md"]
