[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-backend"
version = "0.2.0"
description = "Mini-Agent local Agent Runtime and loopback FastAPI backend."
keywords = ["agent", "mcp", "skills", "subagents"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "huggingface-hub>=0.30,<2",
    "jsonschema>=4.23,<5",
    "mcp>=1.28,<2",
    "mdit-py-plugins>=0.6,<1",
    "cryptography>=44,<50",
    "keyring>=25,<26",
    "pylatexenc>=2.10,<3",
    "pyyaml>=6,<7",
    "regex>=2024.11.6,<2027",
    "requests>=2.31,<3",
    "urllib3>=2.2,<3",
    "tokenizers>=0.21,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
web = []
sync = []

[project.scripts]
mini-agent-mcp = "backend.mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"backend.planning.prompts" = ["*.md"]
