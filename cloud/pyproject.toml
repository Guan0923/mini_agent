[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-cloud"
version = "0.3.0"
description = "Mini-Agent cloud account and encrypted snapshot service."
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1",
    "cryptography>=44,<50",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.0"]

[project.scripts]
mini-agent-cloud = "cloud.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
