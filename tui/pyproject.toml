[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-tui"
version = "0.2.0"
description = "Mini-Agent terminal client (client tier)."
requires-python = ">=3.11"
dependencies = [
    "mini-agent-backend",
    "keyring>=25,<26",
    "textual>=8.2,<9",
]

[project.scripts]
mini-agent = "tui.cli:main"
mini-agent-net = "tui.netcli:main"

[tool.setuptools.packages.find]
where = ["src"]
